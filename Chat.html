/* ---------- IndexedDB helpers ---------- */
function openIdb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveDirectoryHandleToIdb(handle) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_KEY_HANDLE);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getDirectoryHandleFromIdb() {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY_HANDLE);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

/* کش کلید اتاق */
async function saveRoomKeyCache(roomPasswordHash, keyRaw) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({ hash: roomPasswordHash, key: keyRaw }, IDB_KEY_CACHE);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getRoomKeyCache() {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY_CACHE);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function clearRoomKeyCache() {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY_CACHE);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------- Web Crypto ---------- */
function str2ab(str) { return new TextEncoder().encode(str); }
function ab2base64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base642ab(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < bytes.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
function ab2hex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function sha256Hex(text) {
  const digest = await crypto.subtle.digest('SHA-256', str2ab(text));
  return ab2hex(digest);
}
async function deriveKeyFromPassword(password, saltBase64) {
  const salt = base642ab(saltBase64);
  const baseKey = await crypto.subtle.importKey('raw', str2ab(password), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' }, baseKey, AES_ALGO, false, ['encrypt', 'decrypt']);
}
async function encryptJson(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = str2ab(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  const combined = new Uint8Array(iv.byteLength + cipher.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipher), iv.byteLength);
  return ab2base64(combined.buffer);
}
async function decryptJson(key, base64Combined) {
  const combined = new Uint8Array(base642ab(base64Combined));
  const iv = combined.slice(0, 12);
  const cipher = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

/* ---------- File System Access ---------- */
async function readChatFileRaw() {
  if (!directoryHandle) throw new Error('ERR_NO_DIR');
  try {
    const fh = await directoryHandle.getFileHandle(CHAT_FILENAME, { create: false });
    const file = await fh.getFile();
    return { content: await file.text(), lastModified: file.lastModified };
  } catch (err) {
    if (err.name === 'NotFoundError' || err.message.includes('NotFoundError')) return null;
    throw err;
  }
}

async function writeChatFileRaw(content) {
  if (!directoryHandle) throw new Error('ERR_NO_DIR');
  const fh = await directoryHandle.getFileHandle(CHAT_FILENAME, { create: true });
  const writable = await fh.createWritable();
  await writable.write(content);
  await writable.close();
}

async function ensureUploadsDir() {
  if (!directoryHandle) throw new Error('ERR_NO_DIR');
  return directoryHandle.getDirectoryHandle('uploads', { create: true });
}

async function removeUploadsDir() {
  if (!directoryHandle) return;
  try {
    if (directoryHandle.removeEntry) {
      await directoryHandle.removeEntry('uploads', { recursive: true }).catch(()=>{});
    } else {
      const dir = await directoryHandle.getDirectoryHandle('uploads', { create: false }).catch(()=>null);
      if (!dir) return;
      for await (const [name, handle] of dir.entries()) {
        try {
          if (handle.kind === 'file') await dir.removeEntry(name);
          else if (handle.kind === 'directory' && dir.removeEntry) await dir.removeEntry(name, { recursive: true });
        } catch(e){}
      }
    }
  } catch(e){}
}

/* بارگذاری داده با کش کلید */
async function loadDataWithPassword(roomPassword) {
  const pwdHash = await sha256Hex(roomPassword);
  let key = null;

  const cached = await getRoomKeyCache();
  if (cached && cached.hash === pwdHash) {
    key = await crypto.subtle.importKey('raw', base642ab(cached.key), AES_ALGO, false, ['encrypt', 'decrypt']);
  }

  let raw = await readChatFileRaw();
  if (!raw) {
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const saltBase64 = ab2base64(saltBytes.buffer);
    const initial = { version: 1, adminHash: null, users: {}, messages: [], creator: null, roomResetAt: null, typing: {} };
    if (!key) key = await deriveKeyFromPassword(roomPassword, saltBase64);
    const enc = await encryptJson(key, initial);
    const combined = saltBase64 + SALT_SEPARATOR + enc;
    await writeChatFileRaw(combined);
    currentSalt = saltBase64;
    currentKey = key;
    const rawKey = ab2base64(await crypto.subtle.exportKey('raw', key));
    await saveRoomKeyCache(pwdHash, rawKey);
    return { data: initial, key, saltBase64 };
  }

  const { content } = raw;
  const sepIdx = content.indexOf(SALT_SEPARATOR);
  if (sepIdx < 0) throw new Error('ERR_INVALID_FORMAT');
  const saltBase64 = content.slice(0, sepIdx);
  const enc = content.slice(sepIdx + 1);

  if (!key) key = await deriveKeyFromPassword(roomPassword, saltBase64);
  const data = await decryptJson(key, enc);
  currentSalt = saltBase64;
  currentKey = key;

  const rawKey = ab2base64(await crypto.subtle.exportKey('raw', key));
  await saveRoomKeyCache(pwdHash, rawKey);
  return { data, key, saltBase64 };
}

/* ذخیره با retry */
async function saveDataWithRetries(expectedVersion, modifyCallback) {
  for (let attempt = 0; attempt < MAX_WRITE_RETRIES; attempt++) {
    const raw = await readChatFileRaw();
    if (!raw) throw new Error('ERR_FILE_NOT_FOUND');
    const { content } = raw;
    const sepIdx = content.indexOf(SALT_SEPARATOR);
    if (sepIdx < 0) throw new Error('ERR_INVALID_FORMAT');
    const saltBase64 = content.slice(0, sepIdx);
    const enc = content.slice(sepIdx + 1);
    let key;
    if (saltBase64 === currentSalt && currentKey) {
      key = currentKey;
    } else {
      key = await deriveKeyFromPassword(currentRoomPassword, saltBase64);
      currentSalt = saltBase64;
      currentKey = key;
    }
    const data = await decryptJson(key, enc);
    const now = Date.now();
    data.messages = (data.messages || []).filter(m => (now - m.timestamp) <= MESSAGE_RETENTION_MS);
    data.typing = data.typing || {};

    if (data.version !== expectedVersion) {
      expectedVersion = data.version;
      if (attempt < MAX_WRITE_RETRIES - 1) {
        await new Promise(r => setTimeout(r, 20 * (attempt + 1) + Math.random() * 30));
        continue;
      }
      throw new Error('ERR_SAVE_RETRIES');
    }

    modifyCallback(data);
    data.version = (data.version || 0) + 1;

    const newEnc = await encryptJson(key, data);
    const combined = saltBase64 + SALT_SEPARATOR + newEnc;
    await writeChatFileRaw(combined);
    return data;
  }
  throw new Error('ERR_SAVE_RETRIES');
}

async function readAndDecryptCurrent() {
  const raw = await readChatFileRaw();
  if (!raw) throw new Error('ERR_FILE_NOT_FOUND');
  const { content, lastModified } = raw;
  if (lastModified === lastFileModified && currentData) {
    return { data: currentData, key: currentKey, saltBase64: currentSalt };
  }
  lastFileModified = lastModified;
  const sepIdx = content.indexOf(SALT_SEPARATOR);
  if (sepIdx < 0) throw new Error('ERR_INVALID_FORMAT');
  const saltBase64 = content.slice(0, sepIdx);
  const enc = content.slice(sepIdx + 1);
  let key;
  if (saltBase64 === currentSalt && currentKey) {
    key = currentKey;
  } else {
    key = await deriveKeyFromPassword(currentRoomPassword, saltBase64);
    currentSalt = saltBase64;
    currentKey = key;
  }
  const data = await decryptJson(key, enc);
  data.messages = (data.messages || []).filter(m => (Date.now() - m.timestamp) <= MESSAGE_RETENTION_MS);
  data.typing = data.typing || {};
  return { data, key, saltBase64 };
}

async function ensureDirectoryHandle() {
  if (directoryHandle) {
    try {
      if (typeof directoryHandle.queryPermission === 'function') {
        if ((await directoryHandle.queryPermission({ mode: 'readwrite' })) === 'granted') return;
      } else if (typeof directoryHandle.requestPermission !== 'function') {
        return;
      }
    } catch(e){}
  }
  const saved = await getDirectoryHandleFromIdb();
  if (saved) {
    try {
      if (typeof saved.queryPermission === 'function') {
        if ((await saved.queryPermission({ mode: 'readwrite' })) !== 'granted') {
          const perm = await saved.requestPermission({ mode: 'readwrite' });
          if (perm !== 'granted') throw new Error('ERR_PERMISSION_DENIED');
        }
      }
      directoryHandle = saved;
      return;
    } catch(e) { throw new Error('ERR_PERMISSION_DENIED'); }
  }
  throw new Error('ERR_NO_DIR');
}

function validateUsernameRaw(name) {
  if (!name) return { ok: false, msg: ERROR_MESSAGES.ERR_FIELDS_REQUIRED };
  const trimmed = name.trim();
  if (/\s/.test(trimmed)) return { ok: false, msg: ERROR_MESSAGES.ERR_USERNAME_INVALID };
  return { ok: true, name: trimmed.toLowerCase() };
}

function performLogout(message = 'شما خارج شدید.') {
  clearSession();
  currentUsername = '';
  currentPersonalPassword = '';
  currentRoomPassword = '';
  currentSalt = null;
  currentKey = null;
  currentData = null;

  typingIndicator.classList.add('hidden');
  if (pollTimer) clearInterval(pollTimer);

    adminModal.setAttribute('aria-hidden', 'true');
  }
}

/* ---------- ورود ---------- */
async function handleLogin() {
  showLoginMessage('', 'info');
  try {
    await ensureDirectoryHandle().catch(()=>{ showLoginMessage(ERROR_MESSAGES.ERR_NO_DIR, 'error'); throw new Error('STOP'); });

    const roomPassword = roomPasswordInput.value;
    const usernameRaw = usernameInput.value;
    const personalPassword = personalPasswordInput.value;

    if (!roomPassword || !usernameRaw || !personalPassword) { showLoginMessage(ERROR_MESSAGES.ERR_FIELDS_REQUIRED, 'error'); return; }

    const v = validateUsernameRaw(usernameRaw);
    if (!v.ok) { showLoginMessage(v.msg, 'error'); return; }
    const username = v.name;

    let loaded;
    try { loaded = await loadDataWithPassword(roomPassword); } catch(e) {
      showLoginMessage(ERROR_MESSAGES.ERR_DECRYPT_FAIL, 'error');
      return;
    }

    currentRoomPassword = roomPassword;
    currentKey = loaded.key;
    currentData = loaded.data;
    currentSalt = loaded.saltBase64;

    if (currentData.roomResetAt) {
      showLoginMessage('اتاق در حال بازنشانی است. لطفاً منتظر بمانید.', 'info');
      return;
    }

    const now = Date.now();
    currentData.messages = (currentData.messages || []).filter(m => (now - m.timestamp) <= MESSAGE_RETENTION_MS);

    const userEntry = currentData.users[username];
    const isFirstUser = Object.keys(currentData.users || {}).length === 0;

    if (isFirstUser) {
      const userHash = await sha256Hex(username + ':' + personalPassword);
      currentData.users[username] = { hash: userHash, approved: true, active: true, registeredAt: Date.now(), theme: 'light' };
      currentData.creator = username;
      currentData.version = (currentData.version || 0) + 1;
      const raw = await readChatFileRaw();
      const sepIdx = raw.content.indexOf(SALT_SEPARATOR);
      const saltBase64 = raw.content.slice(0, sepIdx);
      const enc = await encryptJson(currentKey, currentData);
      await writeChatFileRaw(saltBase64 + SALT_SEPARATOR + enc);

      currentUsername = username;
      currentPersonalPassword = personalPassword;
      currentUserDisplay.textContent = currentUsername;
      applyUserTheme(currentData.users[username].theme);
      showLoginMessage('اتاق جدید ایجاد شد و شما به‌عنوان اولین کاربر وارد شدید.', 'success');
      saveSession();
      openChatScreen();
      return;
    }

    if (!userEntry) {
      const userHash = await sha256Hex(username + ':' + personalPassword);
      const newUser = { hash: userHash, approved: false, active: true, registeredAt: Date.now(), theme: 'light' };
      const saved = await saveDataWithRetries(currentData.version || 0, d => { d.users[username] = newUser; });
      currentData = saved;
      showLoginMessage('ثبت‌نام انجام شد. منتظر تأیید مدیر باشید.', 'info');
      return;
    }

    if (userEntry.active === false) { showLoginMessage(ERROR_MESSAGES.ERR_USER_INACTIVE, 'error'); return; }

    const expectedHash = userEntry.hash;
    const providedHash = await sha256Hex(username + ':' + personalPassword);
    if (expectedHash !== providedHash) { showLoginMessage(ERROR_MESSAGES.ERR_AUTH_FAIL, 'error'); return; }
    if (!userEntry.approved) { showLoginMessage(ERROR_MESSAGES.ERR_USER_NOT_APPROVED, 'info'); return; }

    currentUsername = username;
    currentPersonalPassword = personalPassword;
    currentUserDisplay.textContent = currentUsername;
    applyUserTheme(userEntry.theme || 'light');
    showLoginMessage('ورود موفقیت‌آمیز بود.', 'success');
    saveSession();
    openChatScreen();
  } catch(e) { if (e.message !== 'STOP') { console.error(e); showLoginMessage(ERROR_MESSAGES.ERR_UNKNOWN, 'error'); } }
}

function applyUserTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

/* ---------- نمایش پیام‌ها (تکه‌ای) ---------- */
function renderMessages(messages) {
  messagesContainer.innerHTML = '';
  const frag = document.createDocumentFragment();
  const list = messages || [];
  const BATCH = 20;
  let i = 0;

  function addBatch() {
    const end = Math.min(i + BATCH, list.length);
    for (; i < end; i++) {
      const msg = list[i];
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble ' + (msg.user === currentUsername ? 'mine' : 'other');
      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = `${msg.user} — ${new Date(msg.timestamp).toLocaleString('fa-IR')}`;
      const content = document.createElement('div');
      content.className = 'message-text';

      if (msg.type === 'file') {
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = msg.name + ' (فایل)';
        link.onclick = async (e) => {
          e.preventDefault();
          try { await downloadFile(msg.storedName, msg.name); } catch(e) { alert(ERROR_MESSAGES.ERR_DOWNLOAD_FAIL); }
        };
        content.appendChild(link);
      } else {
        content.textContent = msg.text;
      }
      bubble.appendChild(meta);
      bubble.appendChild(content);
      frag.appendChild(bubble);
    }
    messagesContainer.appendChild(frag);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    if (i < list.length) requestAnimationFrame(addBatch);
  }
  requestAnimationFrame(addBatch);
}

/* کشیدن صف ارسال */
async function processOutbox() {
  if (!currentData || !currentUsername) return;
  const ids = new Set((currentData.messages || []).map(m => m.localId).filter(Boolean));
  for (const item of outbox.slice()) {
    if (!ids.has(item.localId)) {
      await sendMessage(item.text, item.localId);
      if (currentData && currentData.messages.some(m => m.localId === item.localId)) {
        outbox = outbox.filter(o => o.localId !== item.localId);
      }
    } else {
      outbox = outbox.filter(o => o.localId !== item.localId);
    }
  }
}

async function refreshDataAndUI() {
  if (refreshInProgress) return;
  refreshInProgress = true;
  try {
    const { data } = await readAndDecryptCurrent();
    currentData = data;
    lastKnownVersion = data.version;

    if (currentUsername && data.users && data.users[currentUsername] && data.users[currentUsername].active === false) {
      performLogout('حساب شما توسط مدیر غیرفعال شده است.');
      refreshInProgress = false;
      return;
    }

    renderMessages(data.messages || []);
    updateTypingIndicator(data.typing || {});
    if (adminAuthenticated) renderAdminLists();

    // نوتیفیکیشن برای پیام جدید فقط وقتی صفحه مخفی باشد
    if (document.hidden && lastKnownVersion !== null) {
      const unread = (data.messages || []).filter(m => m.user !== currentUsername).slice(-1);
      if (unread.length && Notification.permission === 'granted') {
        new Notification(unread[0].user, { body: unread[0].text, icon: 'data:image/svg+xml,...' });
      }
    }

    await processOutbox();
  } catch(e) {
    if (e.message === 'ERR_DECRYPT_FAIL' || e.message === 'ERR_INVALID_FORMAT' || e.message === 'ERR_FILE_NOT_FOUND') {
      performLogout('اتاق در دسترس نیست یا رمز تغییر کرده است. لطفاً دوباره وارد شوید.');
    }
  } finally {
    refreshInProgress = false;
  }
}

function openChatScreen() {
  loginScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');
  refreshDataAndUI();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshDataAndUI, POLL_INTERVAL_MS);
  setTimeout(() => messageInput.focus(), 200);
  if (Notification.permission === 'default') Notification.requestPermission();
}

/* ---------- ارسال پیام ---------- */
async function sendMessage(text, localId = null) {
  if (!text || !text.trim()) return;
  const trimmed = text.trim();
  const messageId = localId || (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2, 9));
  try {
    const saved = await saveDataWithRetries(lastKnownVersion || (currentData.version || 0), (data) => {
      data.messages = (data.messages || []).filter(m => (Date.now() - m.timestamp) <= MESSAGE_RETENTION_MS);
      data.messages.push({ localId: messageId, user: currentUsername, text: trimmed, timestamp: Date.now(), type: 'text' });
    });
    currentData = saved;
    lastKnownVersion = saved.version;
    renderMessages(saved.messages || []);
    messageInput.value = '';
    return saved;
  } catch(e) {
    if (!localId) {
      outbox.push({ localId: messageId, text: trimmed });
    }
    alert(ERROR_MESSAGES.ERR_SEND_FAIL);
  }
}

/* ---------- تایپ ---------- */
async function updateTyping() {
  if (!currentUsername || !currentData) return;
  const now = Date.now();
  if (now - lastTypingUpdate < TYPING_DEBOUNCE_MS) return;
  lastTypingUpdate = now;
  try {
    const saved = await saveDataWithRetries(lastKnownVersion || (currentData.version || 0), (data) => {
      data.typing = data.typing || {};
      data.typing[currentUsername] = now;
    });
    currentData = saved;
    lastKnownVersion = saved.version;
  } catch(e) {}
}

messageInput.addEventListener('input', () => {
  updateTyping();
  if (typingTimer) clearTimeout(typingTimer);
  typingTimer = setTimeout(updateTyping, TYPING_DEBOUNCE_MS);
});

function updateTypingIndicator(typing) {
  const now = Date.now();
  const typers = Object.entries(typing).filter(([user, ts]) => user !== currentUsername && (now - ts) < TYPING_TIMEOUT_MS).map(([user]) => user);
  if (typers.length) {
    typingIndicator.textContent = typers.join('، ') + ' در حال تایپ...';
    typingIndicator.classList.remove('hidden');
  } else {
    typingIndicator.classList.add('hidden');
  }
}

/* ---------- فایل ---------- */
async function uploadFile(file) {
  if (!directoryHandle) { alert(ERROR_MESSAGES.ERR_NO_DIR); return; }
  if (file.size > UPLOAD_MAX_BYTES) { alert(ERROR_MESSAGES.ERR_UPLOAD_TOO_LARGE); return; }
  try {
    const uploads = await ensureUploadsDir();
    const safeName = file.name.replace(/[\\/:\*\?"<>\|]/g, '_');
    const storedName = `${Date.now()}__${currentUsername}__${safeName}`;
    const fh = await uploads.getFileHandle(storedName, { create: true });
    const w = await fh.createWritable();
    await w.write(file);
    await w.close();

    const saved = await saveDataWithRetries(lastKnownVersion || (currentData.version || 0), (data) => {
      data.messages.push({ user: currentUsername, type: 'file', name: file.name, storedName, timestamp: Date.now() });
    });
    currentData = saved;
    lastKnownVersion = saved.version;
    renderMessages(saved.messages || []);
    alert('فایل با موفقیت آپلود شد.');
  } catch(e) { alert(ERROR_MESSAGES.ERR_UPLOAD_FAIL); }
}

async function downloadFile(storedName, originalName) {
  if (!directoryHandle) throw new Error('ERR_NO_DIR');
  const uploads = await directoryHandle.getDirectoryHandle('uploads', { create: false });
  const fh = await uploads.getFileHandle(storedName, { create: false });
  const file = await fh.getFile();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = originalName || file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function withWaitCursor(fn) {
  document.body.style.cursor = 'wait';
  try { await fn(); } finally { document.body.style.cursor = ''; }
}

function renderAdminLists() {
  pendingUsersList.innerHTML = '';
  approvedUsersList.innerHTML = '';
  const users = currentData.users || {};
  Object.keys(users).forEach(username => {
    const u = users[username];
    const row = document.createElement('div');
    row.className = 'user-row';
    const left = document.createElement('div');
    left.className = 'user-info';
    left.innerHTML = `<span>${username}</span><div class="user-meta">ثبت‌نام: ${new Date(u.registeredAt).toLocaleString('fa-IR')}</div><div class="user-meta status-label">${u.active === false ? 'غیرفعال' : 'فعال'}</div>`;
    row.appendChild(left);

    const actions = document.createElement('div');
    actions.className = 'user-actions';

    if (!u.approved) {
      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn small';
      approveBtn.textContent = 'تأیید';
      approveBtn.onclick = () => withWaitCursor(async () => {
        const saved = await saveDataWithRetries(currentData.version || 0, d => { if (d.users[username]) d.users[username].approved = true; });
        currentData = saved; lastFileModified = null; lastKnownVersion = saved.version;
        await refreshDataAndUI(); showAdminMessage(ERROR_MESSAGES.INFO_USER_APPROVED, 'success');
      });
      const delBtn = document.createElement('button');
      delBtn.className = 'btn danger small';
      delBtn.textContent = 'حذف';
      delBtn.onclick = () => withWaitCursor(async () => {
        if (!confirm('حذف کاربر؟')) return;
        const saved = await saveDataWithRetries(currentData.version || 0, d => { delete d.users[username]; });
        currentData = saved; lastFileModified = null; lastKnownVersion = saved.version;
        await refreshDataAndUI(); showAdminMessage('کاربر حذف شد.', 'success');
      });
      actions.append(approveBtn, delBtn);
      row.appendChild(actions);
      pendingUsersList.appendChild(row);
    } else {
      const chPwd = document.createElement('button');
      chPwd.className = 'btn small';
      chPwd.textContent = 'تغییر رمز';
      chPwd.onclick = () => withWaitCursor(async () => {
        const np = prompt(`رمز جدید برای ${username}:`);
        if (!np) return;
        const hash = await sha256Hex(username + ':' + np);
        const saved = await saveDataWithRetries(currentData.version || 0, d => { if (d.users[username]) d.users[username].hash = hash; });
        currentData = saved; lastFileModified = null; lastKnownVersion = saved.version;
        await refreshDataAndUI(); showAdminMessage('رمز تغییر کرد.', 'success');
      });
      const toggle = document.createElement('button');
      toggle.className = 'btn small';
      toggle.textContent = u.active === false ? 'فعال‌سازی' : 'غیرفعال‌سازی';
      toggle.onclick = () => withWaitCursor(async () => {
        const saved = await saveDataWithRetries(currentData.version || 0, d => { if (d.users[username]) d.users[username].active = !(d.users[username].active === false); });
        currentData = saved; lastFileModified = null; lastKnownVersion = saved.version;
        await refreshDataAndUI(); showAdminMessage(ERROR_MESSAGES.INFO_USER_TOGGLED, 'success');
      });
      const delBtn = document.createElement('button');
      delBtn.className = 'btn danger small';
      delBtn.textContent = 'حذف';
      delBtn.onclick = () => withWaitCursor(async () => {
        if (!confirm('حذف کاربر؟')) return;
        const saved = await saveDataWithRetries(currentData.version || 0, d => { delete d.users[username]; });
        currentData = saved; lastFileModified = null; lastKnownVersion = saved.version;
        await refreshDataAndUI(); showAdminMessage('کاربر حذف شد.', 'success');
      });
      actions.append(chPwd, toggle, delBtn);
      row.appendChild(actions);
      approvedUsersList.appendChild(row);
    }
  });
}

async function handleAdminLogin() {
  adminLoginMessage.textContent = '';
  const pwd = adminPasswordInput.value;
  if (!pwd) { adminLoginMessage.textContent = 'رمز مدیریت را وارد کنید.'; adminLoginMessage.className = 'message-area error'; return; }
  const { data } = await readAndDecryptCurrent();
  currentData = data;
  if (!currentData.adminHash) {
    const h = await sha256Hex(pwd);
    await saveDataWithRetries(data.version || 0, d => { d.adminHash = h; });
    adminAuthenticated = true;
    adminLoginArea.classList.add('hidden');
    adminPanel.classList.remove('hidden');
    renderAdminLists();
    adminLoginMessage.textContent = ERROR_MESSAGES.INFO_ADMIN_SET;
    adminLoginMessage.className = 'message-area success';
    return;
  }
  if (await sha256Hex(pwd) === currentData.adminHash) {
    adminAuthenticated = true;
    adminLoginArea.classList.add('hidden');
    adminPanel.classList.remove('hidden');
    renderAdminLists();
    adminLoginMessage.textContent = 'ورود موفق.';
    adminLoginMessage.className = 'message-area success';
  } else {
    adminLoginMessage.textContent = ERROR_MESSAGES.ERR_ADMIN_AUTH;
    adminLoginMessage.className = 'message-area error';
  }
}

async function handleDeleteRoom() {
  if (!confirm('حذف اتاق؟')) return;
  const newPwd = prompt('رمز جدید اتاق:');
  if (!newPwd) return;
  await withWaitCursor(async () => {
    const raw = await readChatFileRaw();
    const { content } = raw;
    const sepIdx = content.indexOf(SALT_SEPARATOR);
    const saltOld = content.slice(0, sepIdx);
    const encOld = content.slice(sepIdx + 1);
    const keyOld = await deriveKeyFromPassword(currentRoomPassword, saltOld);
    const data = await decryptJson(keyOld, encOld);
    data.messages = [];
    data.roomResetAt = null;
    data.version = (data.version || 0) + 1;
    const saltNew = ab2base64(crypto.getRandomValues(new Uint8Array(16)).buffer);
    const keyNew = await deriveKeyFromPassword(newPwd, saltNew);
    await writeChatFileRaw(saltNew + SALT_SEPARATOR + await encryptJson(keyNew, data));
    await removeUploadsDir();
    showAdminMessage(ERROR_MESSAGES.INFO_ROOM_DELETED, 'success');
    closeAdminModalFunc();
    await clearRoomKeyCache();
    performLogout('اتاق بازنشانی شد. با رمز جدید وارد شوید.');
  });
}

async function handleBackup() {

  a.download = 'chatroom_backup.dat';
  document.body.appendChild(a);

  URL.revokeObjectURL(a.href);

}

  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyQ') {
    e.preventDefault();
    if (adminModal.classList.contains('hidden')) openAdminModal(); else closeAdminModalFunc();
  }
});

logoutBtn.addEventListener('click', () => performLogout('شما خارج شدید.'));
themeToggleBtn.addEventListener('click', toggleTheme);

changePwdBtn.addEventListener('click', async () => {
  const oldPwd = prompt('رمز فعلی:');
  if (!oldPwd) return;
  if (await sha256Hex(currentUsername + ':' + oldPwd) !== currentData.users[currentUsername].hash) { alert('رمز نادرست.'); return; }
  const newPwd = prompt('رمز جدید:');
  if (!newPwd) return;
  const newHash = await sha256Hex(currentUsername + ':' + newPwd);
  await saveDataWithRetries(currentData.version || 0, d => { d.users[currentUsername].hash = newHash; });
  currentPersonalPassword = newPwd;
  saveSession();
  alert('رمز تغییر کرد.');
});

/* session */
function saveSession() {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: currentUsername, personalPassword: currentPersonalPassword, roomPassword: currentRoomPassword }));
}
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }
function loadSession() { const raw = sessionStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }

/* init */
(async function init() {
  try {
    const saved = await getDirectoryHandleFromIdb();
    if (saved) {
      try {
        if ((await saved.requestPermission({ mode: 'readwrite' })) === 'granted') {
          directoryHandle = saved;
          showLoginMessage('پوشه اشتراکی آماده است.', 'info');
        } else showLoginMessage('پوشه قبلی مجوز ندارد. دوباره انتخاب کنید.', 'info');
      } catch(e) { showLoginMessage('پوشه قبلی مجوز ندارد.', 'info'); }
    } else showLoginMessage('لطفاً پوشه اشتراکی را انتخاب کنید.', 'info');
  } catch(e) { showLoginMessage('خطا در بازیابی پوشه.', 'error'); }

  const sess = loadSession();
  if (sess && sess.roomPassword && sess.username && sess.personalPassword && directoryHandle) {
    try {
      currentRoomPassword = sess.roomPassword;
      currentUsername = sess.username;
      currentPersonalPassword = sess.personalPassword;
      currentUserDisplay.textContent = sess.username;
      const { data, key, saltBase64 } = await loadDataWithPassword(sess.roomPassword);
      currentData = data; currentKey = key; currentSalt = saltBase64;
      if (data.users[sess.username]?.active === false) { clearSession(); showLoginMessage(ERROR_MESSAGES.ERR_USER_INACTIVE, 'error'); return; }
      applyUserTheme(data.users[sess.username]?.theme || 'light');
      openChatScreen();
    } catch(e) { clearSession(); showLoginMessage('جلسه قبلی منقضی شد.', 'info'); }
  }
})();

window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });

designerNote.addEventListener('mouseenter', () => designerTooltip.style.opacity = '1');
designerNote.addEventListener('mouseleave', () => designerTooltip.style.opacity = '0');
designerNote.addEventListener('focus', () => designerTooltip.style.opacity = '1');
designerNote.addEventListener('blur', () => designerTooltip.style.opacity = '0');
